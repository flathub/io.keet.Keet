id: io.keet.Keet
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: Keet
tags:
  - proprietary
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download # Drop this in Keet v4.17
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: Keet
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/ # TODO(RaisinTen): Use the metainfo file from the archive.
      # - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 flatpak/${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm755 flatpak/entrypoint.sh /app/bin/Keet
      - mkdir -p /app/lib/${FLATPAK_ID}
      - cp -r ./Keet-*/* /app/lib/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://static.keet.io/downloads/4.19.0/Keet-arm64-flatpak.tar.gz
        only-arches:
          - aarch64
        strip-components: 0
        sha512: 620d60b9f5d43705c41cbc24d9731b6fe321b4128e11735c4d9b56ae0e3da60f9f44544a145d8ccedbf231d62f2b0b03129bba502cce85b89a7735b758abfdc5
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/
          version-pattern: href="((?:\d+\.)+\d+)/"
          url-template: https://static.keet.io/downloads/$version/Keet-arm64-flatpak.tar.gz
      - type: archive
        url: https://static.keet.io/downloads/4.19.0/Keet-x64-flatpak.tar.gz
        only-arches:
          - x86_64
        strip-components: 0
        sha512: 4c416eb0342a11154edcd8edbaab0fb62b13af2c0f6a39fb8d64711b5bf0b188023b821b61db93386b55efb8ba02138fb6852c192ad38198715524c29b2753bf
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/
          version-pattern: href="((?:\d+\.)+\d+)/"
          url-template: https://static.keet.io/downloads/$version/Keet-x64-flatpak.tar.gz
      - type: file
        path: io.keet.Keet.metainfo.xml
