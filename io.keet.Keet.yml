id: io.keet.Keet
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: Keet
tags:
  - proprietary
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download # Drop this in Keet v4.17
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: Keet
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/ # TODO(RaisinTen): Use the metainfo file from the archive.
      # - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 flatpak/${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm755 flatpak/entrypoint.sh /app/bin/Keet
      - mkdir -p /app/lib/${FLATPAK_ID}
      - cp -r ./Keet-*/* /app/lib/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://static.keet.io/downloads/4.22.0/Keet-arm64-flatpak.tar.gz
        only-arches:
          - aarch64
        strip-components: 0
        sha512: 1fd00e0ab4f4ae152183c89433cac82957030583944dd0f277303e5a8185bd104acb7f91103e9184ab6bf25f89f987f1a7adcb29633fd38723130c115de18f6a
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/latest/version
          version-pattern: ^\s*((?:\d+\.)+\d+)\s*$
          url-template: https://static.keet.io/downloads/$version/Keet-arm64-flatpak.tar.gz
      - type: archive
        url: https://static.keet.io/downloads/4.22.0/Keet-x64-flatpak.tar.gz
        only-arches:
          - x86_64
        strip-components: 0
        sha512: 4dd94e016480760970edba0b8e6be28e70ee4bdfe9182dc3f89c07a06f4c98cd80eeccc2d7c2f5e11fb0389310826437050f51f795657a3c2c5764692e3b5c40
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/latest/version
          version-pattern: ^\s*((?:\d+\.)+\d+)\s*$
          url-template: https://static.keet.io/downloads/$version/Keet-x64-flatpak.tar.gz
      - type: file
        path: io.keet.Keet.metainfo.xml
