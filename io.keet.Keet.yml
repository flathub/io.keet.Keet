id: io.keet.Keet
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: Keet
tags:
  - proprietary
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download # Drop this in Keet v4.17
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: Keet
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/ # TODO(RaisinTen): Use the metainfo file from the archive.
      # - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 flatpak/${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm755 flatpak/entrypoint.sh /app/bin/Keet
      - mkdir -p /app/lib/${FLATPAK_ID}
      - cp -r ./Keet-*/* /app/lib/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://static.keet.io/downloads/4.21.0/Keet-arm64-flatpak.tar.gz
        only-arches:
          - aarch64
        strip-components: 0
        sha512: f9ed91d80dc72c8f6d40da856c82ff240fe75af8ce8f51467927371c298806828a41c4a1a998f6242e7f3060b3babd96f8a9113f8239e2833394eb63a7790c75
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/latest/version
          version-pattern: ^\s*((?:\d+\.)+\d+)\s*$
          url-template: https://static.keet.io/downloads/$version/Keet-arm64-flatpak.tar.gz
      - type: archive
        url: https://static.keet.io/downloads/4.21.0/Keet-x64-flatpak.tar.gz
        only-arches:
          - x86_64
        strip-components: 0
        sha512: b18cb0e8360dbc7ddc5783f3f760cb9ec794bb67e81d82124966c55ed95256d0caab183637e99ebd5571a9f46e0676f6db2c736253d76d0239272d8d1f148519
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/latest/version
          version-pattern: ^\s*((?:\d+\.)+\d+)\s*$
          url-template: https://static.keet.io/downloads/$version/Keet-x64-flatpak.tar.gz
      - type: file
        path: io.keet.Keet.metainfo.xml
