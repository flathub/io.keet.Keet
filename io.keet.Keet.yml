id: io.keet.Keet
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: Keet
tags:
  - proprietary
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download # Drop this in Keet v4.17
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: Keet
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/ # TODO(RaisinTen): Use the metainfo file from the archive.
      # - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 flatpak/${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm755 flatpak/entrypoint.sh /app/bin/Keet
      - mkdir -p /app/lib/${FLATPAK_ID}
      - cp -r ./Keet-*/* /app/lib/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://static.keet.io/downloads/4.22.1/Keet-arm64-flatpak.tar.gz
        only-arches:
          - aarch64
        strip-components: 0
        sha512: d2f6dea4bc4e4fa545ba2c5b5d811d4c79dc68ac4f37e2a6e1ce1f1e332363d70030b5e310b10b62a77c49681f9cc53abf637f08b7d3295c970b50fe1529c629
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/latest/version
          version-pattern: ^\s*((?:\d+\.)+\d+)\s*$
          url-template: https://static.keet.io/downloads/$version/Keet-arm64-flatpak.tar.gz
      - type: archive
        url: https://static.keet.io/downloads/4.22.1/Keet-x64-flatpak.tar.gz
        only-arches:
          - x86_64
        strip-components: 0
        sha512: b9a5bbdbdc21098a69ac002bf0e3b7cca5119835b8135e6d4fe784a08d4a9a9cf709c7179de2a8dfaec55e2b2f5d8cfa7594268fbc8becf1ebd3b566e1a53bed
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/latest/version
          version-pattern: ^\s*((?:\d+\.)+\d+)\s*$
          url-template: https://static.keet.io/downloads/$version/Keet-x64-flatpak.tar.gz
      - type: file
        path: io.keet.Keet.metainfo.xml
