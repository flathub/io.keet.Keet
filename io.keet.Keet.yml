id: io.keet.Keet
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: Keet
tags:
  - proprietary
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download # Drop this in Keet v4.17
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: Keet
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/ # TODO(RaisinTen): Use the metainfo file from the archive.
      # - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 flatpak/${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm755 flatpak/entrypoint.sh /app/bin/Keet
      - mkdir -p /app/lib/${FLATPAK_ID}
      - cp -r ./Keet-*/* /app/lib/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://static.keet.io/downloads/4.18.0/Keet-arm64-flatpak.tar.gz
        only-arches:
          - aarch64
        strip-components: 0
        sha512: edabb866a80b975b5a1c450f6dbe9bd788fb9b3fe44c7551b745d0f6e13a4d5418cf66aa0cd849c133e85451d4be0b736809e3a9cd1c9e39df4af8690c83725b
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/
          version-pattern: href="((?:\d+\.)+\d+)/"
          url-template: https://static.keet.io/downloads/$version/Keet-arm64-flatpak.tar.gz
      - type: archive
        url: https://static.keet.io/downloads/4.18.0/Keet-x64-flatpak.tar.gz
        only-arches:
          - x86_64
        strip-components: 0
        sha512: 7f3996c79c0893291bdaeda65a7156a7dd88ebd9fab125f0224b5a1d23f051128dfc3ae9d6139738e234eca3b9f390a392d711bb1b5247aa75e8f16e337b23a4
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/
          version-pattern: href="((?:\d+\.)+\d+)/"
          url-template: https://static.keet.io/downloads/$version/Keet-x64-flatpak.tar.gz
      - type: file
        path: io.keet.Keet.metainfo.xml
